[project]
name = "heurist-to-tei"
version = "0.1.0"
description = "Transformation pipeline from Heurist database to TEI depot."
authors = [
    {name = "Maud Mélinand"}
]
license = "CC-BY-SA-4.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "heurist-analyser @ git+https://github.com/LostMa-ERC/Heurist-analyser.git",
    "duckdb>=1.4.1",
    "pandas>=3",
    "lxml>=6.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "numpy>=2.1",
]


[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]