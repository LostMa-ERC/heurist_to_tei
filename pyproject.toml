[project]
name = "heurist-to-tei"
version = "0.1.0"
description = "Transformation pipeline from Heurist database to TEI depot."
authors = [
    {name = "Maud Mélinand"}
]
license = "CC-BY-SA-4.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "heurist-analyser @ git+https://github.com/LostMa-ERC/Heurist-analyser.git",
    "duckdb (>=1.4.1,<2.0.0)",
    "pandas>=3",
    "lxml>=6.1,<7",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]